<text x="26" y="525.0" font-size="11.5" fill="#898781">&#8220;Reached&#8221; is the share of those 130 the swarm committed an answer to; it abstained on the rest.</text>
<text x="26" y="542.0" font-size="11.5" fill="#898781">Band width is the share of the assessment public evidence could not reach, weighted by the marks at stake. It does not track coverage:</text>
<text x="26" y="559.0" font-size="11.5" fill="#898781">Bosnia is reached least of the eight yet has the narrowest band, because most of its golds are &#8220;no&#8221; and carry no marks to lose.</text>
