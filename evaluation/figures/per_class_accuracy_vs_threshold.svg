<text x="26" y="60" font-size="13" fill="#52514e">Raising the threshold keeps only the answers the swarm was more sure of, and rescores each class on whatever survives.</text>
<text x="26" y="84" font-size="14" font-weight="700" fill="#161616">As the bar rises the swarm gets nearly everything right when the answer is yes, and everything wrong when it is no.</text>
