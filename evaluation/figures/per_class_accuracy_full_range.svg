<text x="26" y="38" font-size="21" font-weight="700" fill="#161616">Per-class accuracy across the full confidence range, held-out eight (EXP-36)</text>
<text x="26" y="60" font-size="13" fill="#52514e">Right of the floor, the answers the swarm committed. Left of it, the answers it discarded for being under-confident, scored on the researcher&#8217;s own answer.</text>
<text x="26" y="84" font-size="14" font-weight="700" fill="#161616">Below the floor the swarm is right about no and wrong about yes. Above it that reverses. The floor is where it stops being able to say no.</text>
