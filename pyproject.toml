[project]
name = "odmi-agent-swarm"
version = "0.1.0"
description = "LLM-powered agent swarm for EU Open Data Maturity Index assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "supabase>=2.0",
    "openpyxl>=3.1",       # ODMI question bank parsing
    "tavily-python>=0.5",  # web search
    "playwright>=1.40",    # browser automation for portal scraping
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
